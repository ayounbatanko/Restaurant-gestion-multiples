s=\"gal ph\">🍽️<\/div>';\n\nfunction subInfo(r){const n=Date.now(),dl=e=>Math.max(0,Math.ceil((e-n)/864e5));\n if(r.sub=='suspended')return{ok:false,state:'off',label:'Compte désactivé',end:r.subEnd||r.trialEnd,days:-1};\n if(r.sub=='active')return r.subEnd>n?{ok:true,state:'pro',label:'Pro actif',end:r.subEnd,days:dl(r.subEnd)}:{ok:false,state:'off',label:'Pro expiré',end:r.subEnd,days:-1};\n return r.trialEnd>n?{ok:true,state:'trial',label:'Essai gratuit',end:r.trialEnd,days:dl(r.trialEnd)}:{ok:false,state:'off',label:'Essai terminé',end:r.trialEnd,days:-1}}\nfunction notify(t,b){toast(t+(b?' — '+b:''));try{if(window.Notification&&Notification.permission=='granted')new Notification(t,{body:b||''})}catch(e){}}\ndocument.addEventListener('click',()=>{try{window.Notification&&Notification.permission=='default'&&Notification.requestPermission()}catch(e){}},{once:true});\n<\/script><script>\nconst U=guard('restaurant');let tab=null,cart=[],seen=null;\nconst R=()=>D.get().rests.find(r=>r.id==U.restId);\nconst upd=f=>{const d=D.get();f(d.rests.find(r=>r.id==U.restId),d);D.save(d)};\nconst day=ts=>new Date(ts).toISOString().slice(0,10);\nconst tabs=['dash','pos','orders','menu','hist','drivers','settings'];\nconst tabMeta={\n dash:{label:'Tableau de bord',ico:'⊞'},\n pos:{label:'Caisse',ico:'🧮'},\n orders:{label:'Commandes en ligne',ico:'🛒'},\n menu:{label:'Menu',ico:'🍴'},\n hist:{label:'Historique des ventes',ico:'🕐'},\n drivers:{label:'Gestion des livreurs',ico:'🚚'},\n settings:{label:'Paramètres et réglages',ico:'⚙️'}\n};\nfunction homeGrid(){const pend=D.get().orders.filter(o=>o.restId==U.restId&&o.status=='en attente').length;\n const order=[ 'dash','pos','orders','menu','hist','drivers','settings'];\n const btns=order.map(k=>{const m=tabMeta[k];const badge=(k=='orders'&&pend)?` <span class=\"badge\">${pend}<\/span>`:'';\n  const cls=k==='settings'?'hg-btn full':'hg-btn';\n  return `<button class=\"${cls}\" onclick=\"tab='${k}';render()\"><span class=\"ico\">${m.ico}<\/span><span>${m.label}${badge}<\/span><\/button>`}).join('');\n return `<div class=\"home-grid-wrap\"><div class=\"card\"><h2 style=\"margin:0 0 14px;text-align:center\">RestoGest<\/h2><div class=\"home-grid\">${btns}<\/div><\/div><\/div>`}\nfunction proUI(r,s){\n const e=s.end?new Date(s.end).toLocaleDateString():'';\n // Formulaire de paiement reçu du propriétaire\n if(r.proForm&&r.proForm.sentAt&&!(r.proPayment&&r.proPayment.status==='confirmed')&&!(s.state==='pro'&&s.ok)){\n  if(r.proPayment&&r.proPayment.status==='submitted'){\n   return `<div class=\"card warn\"><b>⏳ Paiement envoyé — en attente de validation<\/b>\n    <p>Vous avez déclaré un paiement le ${new Date(r.proPayment.submittedAt).toLocaleString()}.<br>\n    Mode : <b>${esc(r.proPayment.methodName)}<\/b> · Réf. : <b>${esc(r.proPayment.reference)}<\/b><\/p>\n    <p class=\"mut\">Le propriétaire vérifie la réception, puis active votre abonnement Pro.<\/p><\/div>`;\n  }\n  const f=r.proForm;\n  const opts=(f.methods||[]).map(m=>`<option value=\"${m.id}\">${esc(m.name)}<\/option>`).join('');\n  const details=(f.methods||[]).map(m=>`<div class=\"mut\" data-mid=\"${m.id}\"><b>${esc(m.name)}<\/b> — ${esc(m.details||'Suivez les instructions du propriétaire')}<\/div>`).join('');\n  return `<div class=\"card col\" style=\"border-inline-start:6px solid var(--gold)\">\n   <h3 style=\"margin:0\">💳 Formulaire de paiement Pro<\/h3>\n   <p>Montant : <b>${money(f.amount,f.currency)}<\/b> pour <b>${f.months} mois<\/b><\/p>\n   ${f.note?`<p class=\"mut\">${esc(f.note)}<\/p>`:''}\n   <p class=\"mut\">Choisissez un mode, effectuez le paiement, puis indiquez la référence de transaction.<\/p>\n   <div>${details||'<p class=\"mut\">Aucun détail de paiement.<\/p>'}<\/div>\n   <label>Mode de paiement<select id=\"payMethod\">${opts}<\/select><\/label>\n   <input id=\"payRef\" placeholder=\"N° de transaction / référence de paiement\">\n   <input id=\"payNote\" placeholder=\"Note (optionnel)\">\n   <button type=\"button\" onclick=\"submitProPay()\">Valider mon paiement<\/button>\n  <\/div>`;\n }\n if(s.state=='pro'&&s.ok)return `<div class=\"card okc\"><b>Pro actif<\/b> : jusqu'au ${e} (${s.days} j)<\/div>`;\n if(s.state=='trial'){\n  let extra='';\n  if(r.proRequest&&!(r.proForm&&r.proForm.sentAt)){\n   extra=`<p class=\"mut\">Demande envoyée pour <b>${r.proPlanMonths||'?'} mois<\/b> — en attente du formulaire de paiement du propriétaire.<\/p>`;\n  } else if(!(r.proForm&&r.proForm.sentAt)){\n   extra=planPickerHtml(r);\n  }\n  return `<div class=\"card warn\"><div>🎁 <b>Essai gratuit<\/b> : ${s.days} jour(s) restant(s), jusqu'au ${e}. Ensuite, l'option Pro est obligatoire.<\/div><\/div>${extra}`;\n }\n // expiré / off\n if(r.proRequest&&!(r.proForm&&r.proForm.sentAt)){\n  return `<div class=\"card\"><h3>🔒 ${esc(s.label)}<\/h3><p class=\"mut\">Demande envoyée pour <b>${r.proPlanMonths||'?'} mois<\/b> — en attente du formulaire de paiement.<\/p><\/div>`;\n }\n if(!(r.proForm&&r.proForm.sentAt)){\n  return `<div class=\"card\"><h3>🔒 ${esc(s.label)}<\/h3><p>Activez l'option Pro pour retrouver l'accès complet.<\/p><\/div>${planPickerHtml(r)}`;\n }\n return `<div class=\"card\"><h3>🔒 ${esc(s.label)}<\/h3><\/div>`;\n}\nfunction banner(r,s){return proUI(r,s)}\nfunction render(){const r=R(),s=subInfo(r);\n const title=tab&&tabMeta[tab]?tabMeta[tab].label:r.name;\n hdr(title);nav.innerHTML='';\n // Bouton retour dans l'en-tête quand on est dans une section\n if(tab){\n  const lo=document.getElementById('lo');\n  if(lo){\n   const b=document.createElement('button');\n   b.id='btnBack';b.textContent='← Retour';b.className='';\n   b.style.cssText='background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.4);padding:6px 14px;box-shadow:none;margin-inline-end:6px';\n   b.onclick=()=>{tab=null;render()};\n   lo.parentNode.insertBefore(b,lo);\n  }\n }\n if(!s.ok){m.innerHTML=proUI(r,s)+passwordCard();return}\n if(!tab){m.innerHTML=banner(r,s)+homeGrid();return}\n const back=`<div clas p class=\"mut\">Aucun plat dans le catalogue.<\/p>')},\ndrivers(r){const dv=D.get().users.filter(u=>u.restId==r.id&&u.role=='driver');\n return `<div class=\"card row\"><input id=\"dn\" placeholder=\"Nom\" class=\"g\"><input id=\"dp\" placeholder=\"Téléphone\"><input id=\"dw\" type=\"password\" placeholder=\"Mot de passe\"><input id=\"dw2\" type=\"password\" placeholder=\"Confirmez le mot de passe\"><button onclick=\"addD()\">Créer le compte livreur<\/button><\/div>\n <div class=\"card\"><table>${dv.map(u=>`<tr><td>${esc(u.name)}<\/td><td>${esc(u.phone)}<\/td><\/tr>`).join('')||'<tr><td class=\"mut\">Aucun livreur.<\/td><\/tr>'}<\/table><\/div>`},\nsettings(r){return `<div class=\"card col\"><label>Nom<input id=\"sn\" value=\"${esc(r.name)}\" style=\"width:100%\"><\/label>\n <div class=\"row\">${r.logo?`<img src=\"${r.logo}\" class=\"logo\">`:''}<label>Logo <input type=\"file\" id=\"sl\" accept=\"image/*\"><\/label><\/div>\n <label>Téléphone<input id=\"sp\" value=\"${esc(r.phone)}\" style=\"width:100%\"><\/label><label>Adresse<input id=\"sa\" value=\"${esc(r.address)}\" style=\"width:100%\"><\/label>\n <div class=\"card\" style=\"margin:0;padding:12px;${r.lat!=null?'background:rgba(18,163,107,.1);border-inline-start:4px solid var(--ok)':'background:rgba(255,183,3,.12);border-inline-start:4px solid var(--gold)'}\">\n  <b>📍 Position exacte du restaurant (Google Maps)<\/b>\n  <p class=\"mut\" id=\"restPosMsg\">${r.lat!=null?'Position enregistrée : '+Number(r.lat).toFixed(5)+', '+Number(r.lng).toFixed(5):'Aucune position enregistrée. Détectez-la pour apparaître aux clients les plus proches.'}<\/p>\n  <div class=\"row\"><input id=\"la\" placeholder=\"Latitude\" value=\"${r.lat??''}\"><input id=\"ln\" placeholder=\"Longitude\" value=\"${r.lng??''}\"><\/div>\n  <div class=\"row\" style=\"margin-top:8px\">\n    <button type=\"button\" class=\"sec\" onclick=\"geo()\">📍 Détecter automatiquement ma position<\/button>\n    ${r.lat!=null?`<a target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps?q=${r.lat},${r.lng}\">Voir sur Google Maps<\/a>`:''}\n  <\/div>\n <\/div>\n <label>Devise<select id=\"sc\">${curOptions(r.currency)}<\/select><\/label>\n <label>Moyens de paiement en ligne (séparés par des virgules)<input id=\"sm\" value=\"${esc(r.pay.join(', '))}\" placeholder=\"Carte, Mobile Money\" style=\"width:100%\"><\/label>\n <button onclick=\"saveS()\">Enregistrer<\/button><\/div>\n <div class=\"card\"><b>Carte de visite<\/b><p><a href=\"${cardUrl(r.slug)}\" target=\"_blank\">Ouvrir la carte de visite de ${esc(r.name)}<\/a><\/p><\/div>\n ${passwordCard()}`}};\nfunction addC(i){const p=R().menu[i],x=cart.find(c=>c.n==p.n);x?x.q++:cart.push({n:p.n,p:p.p,q:1});render()}\nfunction sell(){const r=R(),s={id:uid(),date:Date.now(),items:cart,total:cart.reduce((a,i)=>a+i.p*i.q,0),pay:pm.value,src:'caisse'};\n upd(r=>r.sales.push(s));cart=[];printHTML(receipt(r,s));render()}\nfunction reprint(id){const r=R();printHTML(receipt(r,r.sales.find(s=>s.id==id)))}\nfunction so(id,st){setOrder(id,{status:st});render()}\nasync function addP(){const n=pn.value.trim(),p=pp.value,d=pd.value.trim();if(!n||!p)return;const imgs=await Promise.all([...pf.files].map(readImg));upd(r=>r.menu.push({n,p:+p,desc:d,imgs}));render()}\nasync function addImgs(i,fs){const imgs=await Promise.all([...fs].map(readImg));upd(r=>{r.menu[i].imgs=(r.menu[i].imgs||[]).concat(imgs)});render()}\nfunction delImg(i,k){upd(r=>r.menu[i].imgs.splice(k,1));render()}\nfunction editD(i){const v=prompt('Ingrédients et description',R().menu[i].desc||'');if(v!==null){upd(r=>r.menu[i].desc=v.trim());render()}}\nfunction addD(){const d=D.get();if(!dn.value||!dp.value||!dw.value)return;if(dw.value!=dw2.value)return alert('Les deux mots de passe ne sont pas identiques.');if(d.users.some(u=>u.phone==dp.value))return alert('Numéro déjà utilisé');d.users.push({id:uid(),role:'driver',restId:U.restId,name:dn.value,phone:dp.value,pass:dw.value});D.save(d);render()}\nfunction geo(){\n if(!naviga holder'))e.setAttribute('placeholder',v)})}\nlet _obs=null;function startTr(){if(_obs||lang()=='fr')return;const o=()=>_obs.observe(document.body,{childList:true,subtree:true,characterData:true});_obs=new MutationObserver(()=>{_obs.disconnect();trDom(document.body);o()});o();trDom(document.body)}\nconst D={get(){let d=JSON.parse(store.g('l',K)||'null');if(!d){d={users:[],rests:[],orders:[]};store.s('l',K,JSON.stringify(d))}return d},save(d){store.s('l',K,JSON.stringify(d))}};\nconst uid=()=>Math.random().toString(36).slice(2,9);\nconst esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nconst me=()=>{const i=store.g('s','uid');return i&&D.get().users.find(u=>u.id==i)};\nconst inShell=SH!==window;\nconst navTo=u=>inShell?parent.nav(u):(location=u.replace(/\\.html$/,'')+'.html');\nconst cardUrl=s=>inShell?'#card/'+s:'card.html?r='+s;\nconst cardSlug=()=>inShell?SH.location.hash.split('/')[1]:new URLSearchParams(location.search).get('r');\nfunction guard(role){const u=me();if(!u||u.role!==role){navTo('index');return null}return u}\nfunction logout(){store.clr();navTo('index')}\nfunction changeMyPassword(oldId,newId,cfId){\n  const oldEl=document.getElementById(oldId||'oldpw'),nwEl=document.getElementById(newId||'newpw'),cfEl=document.getElementById(cfId||'cfpw');\n  if(!oldEl||!nwEl||!cfEl)return;\n  const old=oldEl.value,nw=nwEl.value,cf=cfEl.value;\n  const u=me();if(!u)return alert('Session expirée. Reconnectez-vous.');\n  if(u.pass!==old)return alert('Mot de passe actuel incorrect.');\n  if(nw.length<6)return alert('Le nouveau mot de passe doit contenir au moins 6 caractères.');\n  if(nw!==cf)return alert('Les deux nouveaux mots de passe ne correspondent pas.');\n  if(nw===old)return alert('Choisissez un mot de passe différent de l\\'actuel.');\n  const d=D.get(),uu=d.users.find(x=>x.id===u.id);if(!uu)return alert('Compte introuvable.');\n  uu.pass=nw;D.save(d);\n  // garder la session cohérente\n  oldEl.value=nwEl.value=cfEl.value='';\n  toast('Mot de passe modifié avec succès.');\n}\nfunction passwordCard(){\n  return `<div class=\"card col\"><h3 style=\"margin:0\">🔐 Changer mon mot de passe<\/h3>\n  <p class=\"mut\">Vous pouvez modifier votre mot de passe à tout moment.<\/p>\n  <input id=\"oldpw\" type=\"password\" placeholder=\"Mot de passe actuel\" autocomplete=\"current-password\">\n  <input id=\"newpw\" type=\"password\" placeholder=\"Nouveau mot de passe (6 caractères minimum)\" autocomplete=\"new-password\">\n  <input id=\"cfpw\" type=\"password\" placeholder=\"Confirmer le nouveau mot de passe\" autocomplete=\"new-password\">\n  <button type=\"button\" onclick=\"changeMyPassword()\">Enregistrer le nouveau mot de passe<\/button><\/div>`;\n}\n\nconst slugify=s=>s.toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');\nconst money=(v,c)=>{if(!c||c=='XOF'||c=='XAF')return new Intl.NumberFormat(lang(),{maximumFractionDigits:0}).format(v)+' FCFA';try{return new Intl.NumberFormat(lang(),{style:'currency',currency:c||'XOF'}).format(v)}catch(e){return v+' '+c}};\nconst currencies=()=>Intl.supportedValuesOf?Intl.supportedValuesOf('currency'):['EUR','USD','XOF','MAD','DZD','TND','GBP'];\nconst fdate=ts=>new Date(ts).toLocaleString(lang());\nconst km=(a,b)=>{const R=6371,r=x=>x*Math.PI/180,dl=r(b[0]-a[0]),dn=r(b[1]-a[1]);const h=Math.sin(dl/2)**2+Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))};\nfunction setLang(k){store.s('l','lang',k);inShell?parent.nav(parent.cur):location.reload()}\nfunction hdr(title){document.getElementById('hdr').innerHTML=`<b>${esc(title)}<\/b><span class=\"row\"><span id=\"net\"><\/span><span class=\"lang\">${Object.entries(LANGS).map(([k,v])=>`<button title=\"${v}\" class=\"${k==lang()?'on':''}\" onclick=\"setLang('${k}')\">${k.toUpperCase()}<\/button>`).join('')}<\/span><button id=\"lo\" onclick=\"logout()\">${t('logout')}<\/button><\/span>`;document.documentElement.dir=lang()=='ar'?'rtl':'ltr';const nt=()=>{const e=document.getElementById('net');if(e){e.textContent=navigator.onLine?'● En ligne':'● Hors ligne — caisse active';e.className=navigator.onLine?'':'off'}};nt();addEventListener('online',nt);addEventListener('offline',nt);startTr()}\nfunction toast(m){const e=document.createElement('div');e.className='toast';e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),4500);try{const c=new AudioContext(),o=c.createOscillator();o.connect(c.destination);o.frequency.value=880;o.start();setTimeout(()=>o.stop(),180)}catch(e){}}\nfunction setOrder(id,patch){const d=D.get(),o=d.orders.find(o=>o.id==id);Object.assign(o,patch);\n if(patch.status=='terminée'){d.rests.find(r=>r.id==o.restId).sales.push({id:uid(),date:Date.now(),items:o.items,total:o.total,src:'en ligne'})}D.save(d)}\nfunction receipt(r,x,title){const items=x.items.map(i=>`<tr><td>${esc(i.n)} ×${i.q}<\/td><td style=\"text-align:end\">${money(i.p*i.q,r.currency)}<\/td><\/tr>`).join('');\n return `<div style=\"text-align:center\">${r.logo?`<img src=\"${r.logo}\" style=\"width:60px\"><br>`:''}<b>${esc(r.name)}<\/b><br>${esc(r.address||'')}<br>${esc(r.phone||'')}<hr>${title||'Reçu'} #${esc(x.id)}<br>${fdate(x.date||x.created)}<\/div><table>${items}<\/table><hr><b>TOTAL : ${money(x.total,r.currency)}<\/b><br>${esc(x.pay||'')}<p style=\"text-align:center\">Merci !<\/p>`}\nfunction printHTML(h){document.getElementById('receipt').innerHTML=h;setTimeout(()=>window.print(),150)}\nfunction barChart(data,cur){const m=Math.max(1,...data.map(d=>d.v)),w=300/data.length;\n return `<svg viewBox=\"0 0 300 140\" width=\"100%\">${data.map((d,i)=>{const h=d.v/m*90;return `<rect x=\"${i*w+6}\" y=\"${110-h}\" width=\"${w-12}\" height=\"${h}\" fill=\"var(--acc)\" rx=\"3\"/><text x=\"${i*w+w/2}\" y=\"${105-h}\" font-size=\"7\" text-anchor=\"middle\" fill=\"currentColor\">${Math.round(d.v)}<\/text><text x=\"${i*w+w/2}\" y=\"124\" font-size=\"7\" text-anchor=\"middle\" fill=\"currentColor\">${esc(d.l)}<\/text>`}).join('')}<\/svg>`}\n\nconst curOptions=sel=>['XOF',...currencies().filter(c=>c!='XOF')].map(c=>`<option value=\"${c}\" ${c==(sel||'XOF')?'selected':''}>${c=='XOF'?'FCFA (XOF)':c=='XAF'?'FCFA (XAF)':c}<\/option>`).join('');\nconst readImg=f=>new Promise(res=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,640/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.72))};im.onerror=()=>res(fr.result);im.src=fr.result};fr.readAsDataURL(f)});\nconst gal=(imgs,i)=>imgs&&imgs.length?'<div class=\"gal\">'+imgs.map((s,k)=>`<span class=\"gi\"><img src=\"${s}\" alt=\"\">${i!=null?`<button class=\"x\" onclick=\"delImg(${i},${k})\">✕<\/button>`:''}<\/span>`).join('')+'<\/div>':'<div class=\"gal ph\">🍽️<\/div>';\n\nfunction subInfo(r){const n=Date.now(),dl=e=>Math.max(0,Math.ceil((e-n)/864e5));\n if(r.sub=='suspended')return{ok:false,state:'off',label:'Compte désactivé',end:r.subEnd||r.trialEnd,days:-1};\n if(r.sub=='active')return r.subEnd>n?{ok:true,state:'pro',label:'Pro actif',end:r.subEnd,days:dl(r.subEnd)}:{ok:false,state:'off',label:'Pro expiré',end:r.subEnd,days:-1};\n return r.trialEnd>n?{ok:true,state:'trial',label:'Essai gratuit',end:r.trialEnd,days:dl(r.trialEnd)}:{ok:false,state:'off',label:'Essai terminé',end:r.trialEnd,days:-1}}\nfunction notify(t,b){toast(t+(b?' — '+b:''));try{if(window.Notification&&Notification.permission=='granted')new Notification(t,{body:b||''})}catch(e){}}\ndocument.addEventListener('click',()=>{try{window.Notification&&Notification.permission=='default'&&Notification.requestPermission()}catch(e){}},{once:true});\n<\/script><script>\nconst U=guard('client');let tab='restos',cur=null,cart={},pos=null,seen=null,seenSig='',menuQ='';\n// Demander la localisation dès l'arrivée\nif(navigator.geolocation){\n  navigator.geolocation.getCurrentPosition(\n    p=>{pos=[p.coords.latitude,p.coords.longitude];window._clientGpsAccuracy=Math.round(p.coords.accuracy);if(tab=='restos'&&!cur)render()},\n    ()=>{},\n    {enableHighAccuracy:true,timeout:15000,maximumAge:60000}\n  );\n}\nconst ST=['en attente','acceptée','préparée','colis récupéré','en route','arrivé','terminée'];\nfunction render(){hdr(U.name);nav.innerHTML=['restos','myorders'].map(k=>`<button class=\"${k==tab?'on':''}\" onclick=\"tab='${k}';cur=null;menuQ='';render()\">${t(k)}<\/button>`).join('');m.innerHTML=(tab=='restos'?(cur?menu():list()):orders())+(cur?'':passwordCard())}\nfunction dist(d){return d==null?'':d<1?' — '+Math.round(d*1000)+' m':' — '+d.toFixed(1)+' km'}\nfunction list(){let rs=D.get().rests.filter(r=>subInfo(r).ok);\n rs=rs.map(r=>({r,d:pos&&r.lat!=null&&r.lng!=null?km(pos,[r.lat,r.lng]):null})).sort((a,b)=>(a.d??1e9)-(b.d??1e9));\n const head=pos\n  ?'<h3>Restaurants les plus proches de vous<\/h3><p class=\"mut\">Triés par distance grâce à votre position GPS et celle des restaurants.<\/p>'\n  :'<p class=\"mut\">Activez la localisation pour voir les restaurants les plus proches et pour commander.<\/p><button class=\"sec\" onclick=\"capturePos(()=>render())\">📍 Activer ma localisation<\/button>';\n return head+rs.map(({r,d})=>`<div class=\"card\"><div class=\"row\">${r.logo?`<img class=\"logo\" src=\"${r.logo}\">`:'<div class=\"logo\"><\/div>'}<div class=\"g\"><b>${esc(r.name)}<\/b><div class=\"mut\">${esc(r.address||'')}${dist(d)}${!r.lat?' · position non renseignée':''}<\/div>${r.lat!=null&&r.lng!=null?`<a class=\"mut\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps?q=${r.lat},${r.lng}\">Voir le restaurant sur Google Maps<\/a>`:''}<\/div><button onclick=\"openRest('${r.id}')\">Voir toute la carte<\/button><\/div>\n ${r.menu.length?`<div class=\"gal pv\">${r.menu.slice(0,10).map(p=>`<div class=\"pvi\" onclick=\"openRest('${r.id}')\">${p.imgs&&p.imgs[ ileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,640/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.72))};im.onerror=()=>res(fr.result);im.src=fr.result};fr.readAsDataURL(f)});\nconst gal=(imgs,i)=>imgs&&imgs.length?'<div class=\"gal\">'+imgs.map((s,k)=>`<span class=\"gi\"><img src=\"${s}\" alt=\"\">${i!=null?`<button class=\"x\" onclick=\"delImg(${i},${k})\">✕<\/button>`:''}<\/span>`).join('')+'<\/div>':'<div class=\"gal ph\">🍽️<\/div>';\n\nfunction subInfo(r){const n=Date.now(),dl=e=>Math.max(0,Math.ceil((e-n)/864e5));\n if(r.sub=='suspended')return{ok:false,state:'off',label:'Compte désactivé',end:r.subEnd||r.trialEnd,days:-1};\n if(r.sub=='active')return r.subEnd>n?{ok:true,state:'pro',label:'Pro actif',end:r.subEnd,days:dl(r.subEnd)}:{ok:false,state:'off',label:'Pro expiré',end:r.subEnd,days:-1};\n return r.trialEnd>n?{ok:true,state:'trial',label:'Essai gratuit',end:r.trialEnd,days:dl(r.trialEnd)}:{ok:false,state:'off',label:'Essai terminé',end:r.trialEnd,days:-1}}\nfunction notify(t,b){toast(t+(b?' — '+b:''));try{if(window.Notification&&Notification.permission=='granted')new Notification(t,{body:b||''})}catch(e){}}\ndocument.addEventListener('click',()=>{try{window.Notification&&Notification.permission=='default'&&Notification.requestPermission()}catch(e){}},{once:true});\n<\/script><script>\nconst U=guard('driver');let sig='',myPos=null;\nconst rest=()=>D.get().rests.find(r=>r.id==U.restId);\nconst mine=()=>D.get().orders.filter(o=>o.driverId==U.id&&!['terminée','annulée','refusée'].includes(o.status));\nconst stages=['préparée','colis récupéré','en route','arrivé','terminée'];\nconst nextStage={'préparée':'colis récupéré','colis récupéré':'en route','en route':'arrivé','arrivé':'terminée'};\nconst stageLabel={'préparée':'À récupérer au restaurant','colis récupéré
