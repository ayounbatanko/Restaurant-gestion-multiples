<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Livreur RestoGest</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#14213d"><link rel="apple-touch-icon" href="icon-192.png"><link rel="stylesheet" href="css/style.css"></head><body>
<div id="hdr"></div><main id="m"></main>
<script src="js/app.js"></script><script>
const U=guard('driver');let sig='',myPos=null;
const rest=()=>D.get().rests.find(r=>r.id==U.restId);
const mine=()=>D.get().orders.filter(o=>o.driverId==U.id&&!['terminée','annulée','refusée'].includes(o.status));
const stages=['préparée','colis récupéré','en route','arrivé','terminée'];
const nextStage={'préparée':'colis récupéré','colis récupéré':'en route','en route':'arrivé','arrivé':'terminée'};
const stageLabel={'préparée':'À récupérer au restaurant','colis récupéré':'Colis récupéré','en route':'En route vers le client','arrivé':'Arrivé chez le client','terminée':'Livraison terminée'};
function mapUrl(o){const dest=o.cLat!=null&&o.cLng!=null?o.cLat+','+o.cLng: o.addr;const origin=myPos?myPos.join(','):'';return 'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(dest)+(origin?'&origin='+encodeURIComponent(origin):'')+'&travelmode=driving'}
function changePass(){const old=document.getElementById('oldpw').value,nw=document.getElementById('newpw').value,cf=document.getElementById('cfpw').value;
 if(U.pass!==old)return alert('Mot de passe actuel incorrect.');if(nw.length<6)return alert('Choisissez au moins 6 caractères.');if(nw!==cf)return alert('Les deux nouveaux mots de passe ne correspondent pas.');
 const d=D.get(),u=d.users.find(x=>x.id===U.id);u.pass=nw;D.save(d);['oldpw','newpw','cfpw'].forEach(x=>document.getElementById(x).value='');toast('Mot de passe modifié avec succès.')}
function render(){const d=D.get(),rs=rest();hdr('Espace livreur — '+U.name+(rs?' · '+rs.name:''));const jobs=mine(),done=d.orders.filter(o=>o.driverId==U.id&&o.status=='terminée').reverse().slice(0,10);
 m.innerHTML=`<h3>Mes livraisons</h3>`+(jobs.map(o=>{const nxt=nextStage[o.status],hasGPS=o.cLat!=null&&o.cLng!=null;
 return `<div class="card"><div class="row"><b>Commande #${esc(o.id)}</b><span class="badge" data-s="${o.status}">${esc(o.status)}</span></div>
 <b>${esc(o.clientName)}</b> · ${esc(o.clientPhone)}<p>Adresse : ${esc(o.addr)}</p>
 <p>${o.items.map(i=>`${esc(i.n)} ×${i.q}`).join(', ')}<br><b>${money(o.total,rs?.currency)}</b> (${esc(o.pay)})</p>
 ${hasGPS?`<p class="mut">Position GPS du client enregistrée : ${o.cLat.toFixed(5)}, ${o.cLng.toFixed(5)}</p>`:'<p class="mut">Position GPS précise non disponible : utilisez l’adresse indiquée.</p>'}
 <a href="${mapUrl(o)}" target="_blank" rel="noopener" style="display:inline-block;padding:10px 14px;background:var(--navy2);color:white;text-decoration:none;border-radius:10px;font-weight:700">📍 Ouvrir le trajet dans Google Maps</a>
 <p class="mut">Étape : ${stageLabel[o.status]||o.status}</p>
 ${nxt?`<button onclick="advance('${o.id}','${nxt}')">${nxt=='terminée'?'Confirmer la livraison terminée':'Valider : '+stageLabel[nxt]}</button>`:''}
 </div>`}).join('')||'<p class="mut">Aucune livraison attribuée pour le moment.</p>')+
 (done.length?'<h3>Livraisons terminées</h3>'+done.map(o=>`<div class="card"><b>#${esc(o.id)}</b> — ${esc(o.clientName)} — ${money(o.total,rs?.currency)} <span class="badge" data-s="terminée">terminée</span></div>`).join(''):'')+
 `${passwordCard()}`;
}
function advance(id,status){const o=D.get().orders.find(x=>x.id===id);if(!o||o.driverId!==U.id)return alert('Cette livraison ne vous est pas attribuée.');if(nextStage[o.status]!==status)return alert('Étape invalide.');setOrder(id,{status,stageUpdated:Date.now()});toast('Statut mis à jour : '+stageLabel[status]);render()}
if(navigator.geolocation){navigator.geolocation.watchPosition(p=>{myPos=[p.coords.latitude,p.coords.longitude];mine().filter(o=>o.status=='en route').forEach(o=>setOrder(o.id,{driverPos:myPos}))},()=>{}, {enableHighAccuracy:true,maximumAge:10000,timeout:15000})}
setInterval(()=>{const s=JSON.stringify(mine().map(o=>[o.id,o.status]));if(s!==sig){sig=s;render()}},2000);
render();
</script></body></html>
